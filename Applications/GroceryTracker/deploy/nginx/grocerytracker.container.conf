# nginx inside the compose stack: serves the published Blazor WebAssembly app and forwards /api to
# the BFF container. One origin for the browser, so there is no CORS and no preflight on every sync.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A .NET WebAssembly payload is a few megabytes uncompressed and compresses extremely well, which
  # matters a lot over a home connection to a Pi.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/wasm application/octet-stream image/svg+xml application/manifest+json;

  types {
    application/wasm wasm;
    application/octet-stream dat;
    application/octet-stream blat;
    application/manifest+json webmanifest;
  }

  client_max_body_size 4m;

  location /api/ {
    proxy_pass http://bff:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # A first sync on a device that has been offline for a while can return a lot of rows.
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://bff:5000/health;
    access_log off;
  }

  # Framework assets carry a content hash in their name, so they can be cached hard and forever.
  location /_framework/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # These three decide when a client picks up a new version, so they must never be held in a cache.
  location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /service-worker-assets.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Client-side routing: unknown paths are app routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
