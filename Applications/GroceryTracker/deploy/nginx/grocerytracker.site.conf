# nginx site for a native install on the Pi (no containers for the web tier).
#
#   sudo cp deploy/nginx/grocerytracker.site.conf /etc/nginx/sites-available/grocerytracker
#   sudo ln -s /etc/nginx/sites-available/grocerytracker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Publish the client with:
#   dotnet publish src/UI/GroceryTracker.UI.Blazor -c Release -o /tmp/gt
#   sudo rsync -a --delete /tmp/gt/wwwroot/ /var/www/grocerytracker/

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;

  # Replace with the Pi's hostname or its Tailscale name. Keeping this app off the public internet
  # is the reason it can safely run without authentication.
  server_name raspberrypi.local;

  root /var/www/grocerytracker;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/wasm application/octet-stream image/svg+xml application/manifest+json;

  types {
    application/wasm wasm;
    application/octet-stream dat;
    application/octet-stream blat;
    application/manifest+json webmanifest;
  }

  client_max_body_size 4m;

  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://127.0.0.1:5000/health;
    access_log off;
  }

  location /_framework/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Never cache the files that decide when a device picks up a new build.
  location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /service-worker-assets.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
