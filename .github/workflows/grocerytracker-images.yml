# Builds GroceryTracker's three images for amd64 and arm64 (a Raspberry Pi) and publishes them to
# GitHub's container registry, so nobody has to build from source to run or update GroceryTracker.
#
#   pull request                      build only, to prove the Dockerfiles still work on both platforms
#   push to main                      ghcr.io/codeisnotevil/grocerytracker-*:edge (and :sha-...)
#   tag grocerytracker-v1.2.3         :1.2.3, :1.2, :1, :latest, plus a GitHub release carrying
#                                     compose.yaml and env.example from deploy/release
#
# Release:  bump <Version> in Applications/GroceryTracker/Directory.Build.props, add its section to
#           Applications/GroceryTracker/CHANGELOG.md, merge, then
#           git tag grocerytracker-v1.0.0 && git push origin grocerytracker-v1.0.0
name: GroceryTracker images

on:
  push:
    branches: [main]
    tags: ["grocerytracker-v*"]
    paths:
      - Applications/GroceryTracker/**
      - .github/workflows/grocerytracker-images.yml
  pull_request:
    paths:
      - Applications/GroceryTracker/**
      - .github/workflows/grocerytracker-images.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The tag names the release; Directory.Build.props is what the app shows in Settings → About,
      # and the changelog is what users read. All three must agree before anything is published.
      - name: Tag matches the app version and the changelog
        if: startsWith(github.ref, 'refs/tags/grocerytracker-v')
        run: |
          app=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Applications/GroceryTracker/Directory.Build.props)
          tag="${GITHUB_REF_NAME#grocerytracker-v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::Tag says $tag but Directory.Build.props says $app. Bump <Version> first."
            exit 1
          fi
          python3 Scripts/changelog.py check Applications/GroceryTracker/CHANGELOG.md "$tag"

  image:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/Api/Dockerfile
            description: GroceryTracker API (ASP.NET Core)
          - name: web
            dockerfile: src/UI/Dockerfile
            description: GroceryTracker web app (nginx serving the Blazor PWA and proxying the API)
          - name: migration-runner
            dockerfile: src/MigrationRunner/Dockerfile
            description: GroceryTracker database migrations, run once per start
    steps:
      - uses: actions/checkout@v4

      # Only the final runtime layers run emulated for arm64 (an apt-get and a chmod); the .NET
      # builds run natively on the runner, see the Dockerfiles.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/codeisnotevil/grocerytracker-${{ matrix.name }}
          flavor: latest=false
          # The monorepo prefixes release tags with the app, so semver is matched out of them.
          tags: |
            type=match,pattern=grocerytracker-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=grocerytracker-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=grocerytracker-v(\d+)\.\d+\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/grocerytracker-v') }}
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=grocerytracker-${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: Applications/GroceryTracker
          file: Applications/GroceryTracker/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shows the description on the package page, which reads the image index's annotations.
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=grocerytracker-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=grocerytracker-${{ matrix.name }}

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/grocerytracker-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#grocerytracker-v}"
          # What changed first, from the changelog; then how to install or update.
          python3 Scripts/changelog.py notes Applications/GroceryTracker/CHANGELOG.md "$version" > notes.md
          cat >> notes.md <<EOF

          ---

          Prebuilt images for amd64 and arm64:

          - \`ghcr.io/codeisnotevil/grocerytracker-api:${version}\`
          - \`ghcr.io/codeisnotevil/grocerytracker-web:${version}\`
          - \`ghcr.io/codeisnotevil/grocerytracker-migration-runner:${version}\`

          **Install:** download \`compose.yaml\` and \`env.example\` below into an empty folder, then:

          \`\`\`sh
          cp env.example .env   # set POSTGRES_PASSWORD
          podman compose up -d  # or docker compose up -d
          \`\`\`

          **Update an existing install:** \`podman compose pull && podman compose up -d\`. Your data stays in its volume, and migrations run by themselves.

          Full guide: https://codeisnotevil.github.io/MyMonoRepo/download.html#grocerytracker
          EOF
          gh release create "$TAG" \
            Applications/GroceryTracker/deploy/release/compose.yaml \
            Applications/GroceryTracker/deploy/release/env.example \
            Applications/GroceryTracker/LICENSE \
            --title "GroceryTracker ${version}" --notes-file notes.md --latest=false

      # A release made with GITHUB_TOKEN triggers no other workflows (GitHub's loop protection), so
      # "release: published" in site.yml won't fire. A manual dispatch is the allowed way round it.
      - name: Refresh the download page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run site.yml --ref main
