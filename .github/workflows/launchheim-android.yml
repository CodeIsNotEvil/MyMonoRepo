# Builds LaunchHeim Companion, the Android app in Applications/LaunchHeim/android, runs its unit tests
# and keeps the APK as an artifact. The app takes its version from LaunchHeim's Directory.Build.props,
# so a change there rebuilds it too. Releases are built and signed by F-Droid from the launchheim-v*
# tags (android/README.md "Releases"); this workflow only checks that they will build.
name: LaunchHeim Android

on:
  push:
    paths:
      - Applications/LaunchHeim/android/**
      - Applications/LaunchHeim/Directory.Build.props
      - .github/workflows/launchheim-android.yml
  pull_request:
    paths:
      - Applications/LaunchHeim/android/**
      - Applications/LaunchHeim/Directory.Build.props
      - .github/workflows/launchheim-android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Applications/LaunchHeim/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The runner's SDK may lag behind; OkHttp 5.5 needs compileSdk 37.
      - name: Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      # The release build as F-Droid makes it (unsigned, minified), and a debug build to install for trying.
      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug

      - name: Name the APK after the version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ../Directory.Build.props)
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/LaunchHeimCompanion-$version-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LaunchHeimCompanion-debug-apk
          path: Applications/LaunchHeim/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: LaunchHeimCompanion-test-reports
          path: Applications/LaunchHeim/android/app/build/reports/tests/
          if-no-files-found: ignore
