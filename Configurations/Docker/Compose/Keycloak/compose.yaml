services:
  postgresql:
    # The official image. Bitnami no longer updates its free images. 17 is within the Postgres
    # versions Keycloak 26 supports, and the minor-free tag still brings patch releases.
    image: docker.io/library/postgres:17-alpine
    container_name: postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak_password
      - POSTGRES_DB=keycloak
    healthcheck:
      # Check as the real user and database. The old check asked for a `postgres` role that doesn't exist.
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # A new volume on purpose: Bitnami kept its data in a `data/` subdirectory owned by uid 1001, and
      # the official image refuses to initialise over it. The old `Keycloak_PostgreSQL` volume is left
      # alone. Dump from it with the Bitnami image first if it holds anything worth keeping.
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - keycloak-network

  keycloak:
    # The official image. Bitnami's keycloak image left Docker Hub in 2025, and the official one is
    # the maintained upstream. Pinned to the minor version so a pull brings patches, not a surprise
    # major upgrade.
    image: quay.io/keycloak/keycloak:26.7
    # Dev mode matches what the Bitnami image ran by default: HTTP on 8080, no hostname or TLS setup.
    # Switch to `start` (plus KC_HOSTNAME and TLS) before exposing this beyond localhost.
    command: start-dev
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgresql:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak_password
      # Only creates the admin on first start against an empty database. Changing it later does nothing.
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - '8080:8080'
    networks:
      - keycloak-network

volumes:
  keycloak-postgres-data:
    driver: local

networks:
  keycloak-network:
    driver: bridge
