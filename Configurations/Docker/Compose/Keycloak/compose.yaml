services:
  postgresql:
    # Fully qualified names so this works under Podman as well as Docker.
    image: docker.io/bitnami/postgresql:latest
    container_name: postgresql
    restart: unless-stopped
    environment:
      - POSTGRESQL_USERNAME=keycloak
      - POSTGRESQL_PASSWORD=keycloak_password
      - POSTGRESQL_DATABASE=keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - Keycloak_PostgreSQL:/bitnami/postgresql
    networks:
      - keycloak-network

  keycloak:
    # The official image. Bitnami's keycloak image left Docker Hub in 2025, and the official one is
    # the maintained upstream. Pinned to the minor version so a pull brings patches, not a surprise
    # major upgrade.
    image: quay.io/keycloak/keycloak:26.7
    # Dev mode matches what the Bitnami image ran by default: HTTP on 8080, no hostname or TLS setup.
    # Switch to `start` (plus KC_HOSTNAME and TLS) before exposing this beyond localhost.
    command: start-dev
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgresql:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak_password
      # Only creates the admin on first start against an empty database. Changing it later does nothing.
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - '8080:8080'
    networks:
      - keycloak-network

volumes:
  Keycloak_PostgreSQL:
    driver: local

networks:
  keycloak-network:
    driver: bridge
